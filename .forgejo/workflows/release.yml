name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Release
        env:
          FORGEJO_TOKEN: ${{ secrets.GIT_TOKEN }}
          AK_REGISTRY_URL: ${{ vars.AK_REGISTRY_URL }}
          AK_SNAPSHOT_URL: ${{ vars.AK_SNAPSHOT_URL }}
          AK_USERNAME: ${{ vars.AK_USERNAME }}
          AK_TOKEN: ${{ secrets.AK_TOKEN }}
        run: |
          npm install --no-save semantic-release \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/changelog
          npx semantic-release
